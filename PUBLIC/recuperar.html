<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recuperar contraseña | Jelunor
    </title>

    <link
        rel="stylesheet"
        href="CSS/auth.css"
    >

</head>

<body>

<div class="auth-page">

    <section class="auth-brand">

        <div class="brand-content">

            <img
                src="asset/logo.jpeg"
                alt="Jelunor"
            >

            <h1>
                Jelunor
            </h1>

            <p>
                Recupera el acceso a tu cuenta.
            </p>

        </div>

    </section>


    <section class="auth-form-section">

        <div class="auth-card">

            <div class="auth-heading">

                <span>
                    SEGURIDAD JELUNOR
                </span>

                <h2>
                    Recuperar contraseña
                </h2>

                <p>
                    Confirma tus datos y crea
                    una nueva contraseña.
                </p>

            </div>


            <div class="recovery-info">

                Por seguridad, el correo y el
                documento deben coincidir con
                los datos registrados en Jelunor.

            </div>


            <form id="recoveryForm">


                <div class="form-group">

                    <label for="recoveryEmail">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="recoveryEmail"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="recoveryDocument">
                        Documento
                    </label>

                    <input
                        type="text"
                        id="recoveryDocument"
                        inputmode="numeric"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newRecoveryPassword">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="newRecoveryPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmRecoveryPassword">
                        Confirmar nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmRecoveryPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div
                    id="recoveryMessage"
                    class="mensaje"
                ></div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="recoveryButton"
                >
                    Actualizar contraseña
                </button>

            </form>


            <a
                href="login.html"
                class="back-login"
            >
                ← Volver a iniciar sesión
            </a>

        </div>

    </section>

</div>


<script src="JS/recuperar.js"></script>

</body>

</html>
