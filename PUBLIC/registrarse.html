<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | Jelunor</title>

    <link
        rel="stylesheet"
        href="CSS/auth.css"
    >

</head>


<body>

<div class="auth-page">


    <section class="auth-brand">

        <div class="brand-content">

            <img
                src="asset/logo.jpeg"
                alt="Jelunor"
            >

            <h1>
                Bienvenido a Jelunor
            </h1>

            <p>
                Tu nueva experiencia financiera.
            </p>

        </div>

    </section>



    <section class="auth-form-section">


        <div class="auth-card">


            <div class="auth-heading">

                <span>
                    JELUNOR
                </span>

                <h2>
                    Crea tu cuenta
                </h2>

                <p>
                    Ingresa tus datos para comenzar.
                </p>

            </div>



            <form id="registroForm">


                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        required
                        autocomplete="name"
                    >

                </div>



                <div class="form-group">

                    <label for="documento">
                        Número de documento
                    </label>

                    <input
                        type="text"
                        id="documento"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        required
                        autocomplete="email"
                    >

                </div>



                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        autocomplete="tel"
                    >

                </div>



                <div class="form-row">


                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                    </div>



                    <div class="form-group">

                        <label for="confirmarPassword">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmarPassword"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                </div>



                <div
                    id="mensaje"
                    class="mensaje"
                ></div>



                <button
                    type="submit"
                    class="submit-btn"
                    id="registroButton"
                >
                    Crear cuenta
                </button>


            </form>



            <div class="auth-footer">

                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>


        </div>


    </section>


</div>


<script src="JS/registrarse.js"></script>


</body>

</html>
